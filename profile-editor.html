<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="portal.css"><title>구성원 정보 입력 | 인하 스마트거버넌스</title></head><body><header><div class="bar"><a class="brand" href="index.html">인하 스마트거버넌스<small>POLICY · RESEARCH · EDUCATION</small></a><nav><a href="index.html#policy">정책전공</a><a href="index.html#department">행정학과</a><a href="index.html#institute">연구소</a><a href="members.html">교수·학생</a></nav></div></header><main class="wrap"><section class="section"><div class="eyebrow">Profile Preparation</div><h1>교수·학생 정보 입력</h1><p class="notice">입력한 정보는 이 화면에서만 편집됩니다. “정보 파일 내려받기”로 저장한 뒤 홈페이지 관리자가 GitHub에 반영해야 다른 방문자에게 공개됩니다. 이 화면은 온라인 접수나 공동 저장 기능이 아닙니다.</p><div class="actions"><button class="btn primary" id="add">새 구성원 추가</button><button class="btn secondary" id="export">정보 파일 내려받기</button><label class="btn secondary">저장한 파일 불러오기<input type="file" id="import" accept="application/json,.json" hidden></label></div><div id="editor-list" class="editor-list" aria-label="편집할 구성원"></div><form id="profile-form"><div class="edit-grid"><label>이름 *<input name="name" required maxlength="100"></label><label>영문 이름<input name="name_en" maxlength="150"></label><label>구분<select name="role"><option value="faculty">교수·교원</option><option value="student">학생</option><option value="researcher">연구원</option></select></label><label>직위·역할<input name="position" placeholder="예: 석사과정, 박사과정, 교수" maxlength="100"></label><label class="full">소속 *</label><div id="affiliations" class="checks full"></div><label>학위과정·전공<input name="program" maxlength="150"></label><label>공개용 이메일 (선택)<input name="email" type="email" maxlength="200"></label><label class="full">연구 관심 분야<input name="research" maxlength="400"></label><label class="full">소개·연구 활동<textarea name="bio" maxlength="2000"></textarea></label><div class="checks full"><label><input name="published" type="checkbox">공개할 정보로 표시</label></div></div><div class="actions"><button type="submit" class="btn primary">입력 내용 반영</button><button type="button" class="btn secondary" id="remove">현재 구성원 삭제</button></div><p id="editor-status" role="status"></p></form></section></main><footer class="wrap">인하대학교 스마트거버넌스 · 홈페이지 검토용 시안<br>정책전공 · 행정학과 · 정책연구소</footer><script src="profile-editor.js"></script></body></html>
